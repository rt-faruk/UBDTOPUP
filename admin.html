<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>অ্যাডমিন | UBD TOPUP</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

  <header class="site-header">
    <a class="brand" href="index.html"><img class="logo" src="logo.svg" alt=""><span>UBD TOPUP অ্যাডমিন</span></a>
    <button class="btn small" id="logoutBtn" type="button" hidden>লগআউট</button>
  </header>

  <main class="wrap admin-wrap">

    <p id="notice" class="panel" hidden></p>

    <form id="loginForm" class="panel login" novalidate hidden>
      <h2>অ্যাডমিন লগইন</h2>
      <label for="email">ইমেইল</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">পাসওয়ার্ড</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p id="loginMsg" class="form-msg" role="status"></p>
      <button class="btn" type="submit">লগইন</button>
    </form>

    <section id="dashboard" hidden>
      <div class="toolbar">
        <div class="tabs" id="tabs">
          <button type="button" data-f="Pending" aria-pressed="true">অপেক্ষমাণ <span id="cPending">0</span></button>
          <button type="button" data-f="Done" aria-pressed="false">সম্পন্ন <span id="cDone">0</span></button>
          <button type="button" data-f="Cancelled" aria-pressed="false">বাতিল <span id="cCancelled">0</span></button>
          <button type="button" data-f="All" aria-pressed="false">সব <span id="cAll">0</span></button>
        </div>
        <button class="btn small" id="reloadBtn" type="button">রিফ্রেশ</button>
      </div>
      <p id="listMsg" class="form-msg" role="status"></p>
      <ul id="orders" class="orders"></ul>
    </section>

  </main>

  <script src="firebase-config.js"></script>
  <script src="db.js"></script>
  <script src="admin.js"></script>
</body>
</html>
